<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Snake</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;color:#eee;font-family:system-ui}
canvas{background:#1c1c1c;border:2px solid #444;border-radius:8px}
button{margin-top:12px;padding:8px 18px;border:0;border-radius:6px;background:#22c55e;color:#000;font-weight:600;cursor:pointer}
</style></head><body>
<h2>Snake — Score: <span id="s">0</span> · Best: <span id="b">0</span></h2>
<canvas id="c" width="400" height="400"></canvas>
<button onclick="reset()">Restart</button>
<p>Arrow keys / WASD to move</p>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),G=20,N=20;
let snake,dir,food,score,timer,best=+localStorage.snakeBest||0;
document.getElementById('b').textContent=best;
function reset(){snake=[{x:10,y:10}];dir={x:1,y:0};score=0;place();clearInterval(timer);timer=setInterval(tick,110);upd()}
function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x==food.x&&p.y==food.y))}
function upd(){document.getElementById('s').textContent=score}
function tick(){
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x==h.x&&p.y==h.y)){
    clearInterval(timer);if(score>best){best=score;localStorage.snakeBest=best;document.getElementById('b').textContent=best}
    x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,400,400);x.fillStyle='#fff';x.font='28px system-ui';x.fillText('Game over',140,205);return}
  snake.unshift(h);
  if(h.x==food.x&&h.y==food.y){score++;upd();place()}else snake.pop();
  draw()}
function draw(){
  x.clearRect(0,0,400,400);
  x.fillStyle='#ef4444';x.fillRect(food.x*G+2,food.y*G+2,G-4,G-4);
  snake.forEach((p,i)=>{x.fillStyle=i?'#22c55e':'#86efac';x.fillRect(p.x*G+1,p.y*G+1,G-2,G-2)})}
const keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{const k=keys[e.key];if(!k)return;e.preventDefault();
  if(k[0]!==-dir.x||k[1]!==-dir.y)dir={x:k[0],y:k[1]}});
reset();
</script></body></html>

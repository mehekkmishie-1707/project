<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown Flashcards</title>
<style>
body{font-family:system-ui;max-width:640px;margin:30px auto;padding:0 16px;background:#f8fafc;color:#0f172a}
textarea{width:100%;height:140px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:monospace;box-sizing:border-box}
.card{margin:20px 0;height:200px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:22px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.card.back{background:#0f172a;color:#fff}
button{padding:9px 14px;border:0;border-radius:8px;background:#0f172a;color:#fff;cursor:pointer;margin-right:6px}
</style></head><body>
<h1>Markdown Flashcards</h1>
<p>One card per line: <code>Question :: Answer</code></p>
<textarea id="src">What does git init do? :: Creates a new repository
What does git clone do? :: Copies a remote repository locally
What is HEAD? :: Pointer to the current commit
What does git stash do? :: Temporarily shelves uncommitted changes</textarea>
<p><button onclick="load()">Load cards</button><button onclick="shuffle()">Shuffle</button></p>
<div class="card" id="card" onclick="flip()"></div>
<button onclick="go(-1)">← Prev</button><button onclick="go(1)">Next →</button> <span id="pos"></span>
<script>
let cards=[],i=0,back=false;
src.value=localStorage.fc||src.value;
function load(){localStorage.fc=src.value;cards=src.value.split('\n').map(l=>l.split('::').map(s=>s.trim())).filter(a=>a.length>=2);i=0;back=false;show()}
function show(){const c=cards[i];card.className='card'+(back?' back':'');card.textContent=c?(back?c[1]:c[0]):'Add cards above and click Load';pos.textContent=cards.length?`${i+1}/${cards.length}`:''}
function flip(){back=!back;show()}
function go(d){if(!cards.length)return;i=(i+d+cards.length)%cards.length;back=false;show()}
function shuffle(){cards.sort(()=>Math.random()-.5);i=0;back=false;show()}
addEventListener('keydown',e=>{if(e.target.tagName=='TEXTAREA')return;if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1);if(e.key==' '){e.preventDefault();flip()}});
load();
</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habit Tracker</title>
<style>
body{font-family:system-ui;max-width:640px;margin:30px auto;padding:0 16px;background:#f8fafc;color:#0f172a}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;margin:8px 0}
.name{flex:1;font-weight:600}.streak{color:#f97316;font-size:14px}
.days{display:flex;gap:4px}
.d{width:26px;height:26px;border-radius:6px;border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-size:10px;color:#64748b}
.d.on{background:#22c55e;border-color:#22c55e;color:#fff}
.d.today{outline:2px solid #3b82f6}
form{display:flex;gap:8px}input{flex:1;padding:9px;border:1px solid #cbd5e1;border-radius:8px}
button{padding:9px 14px;border:0;border-radius:8px;background:#0f172a;color:#fff;cursor:pointer}
.del{background:none;color:#94a3b8;padding:4px 8px}
</style></head><body>
<h1>Habit Tracker</h1>
<form id="f"><input id="n" placeholder="New habit (e.g. Read 20 min)" required><button>Add</button></form>
<div id="list"></div>
<script>
let habits=JSON.parse(localStorage.habits||'[]');
const iso=d=>d.toISOString().slice(0,10);
const last7=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
function save(){localStorage.habits=JSON.stringify(habits);render()}
function streak(h){let s=0,d=new Date();if(!h.done.includes(iso(d)))d.setDate(d.getDate()-1);
  while(h.done.includes(iso(d))){s++;d.setDate(d.getDate()-1)}return s}
function render(){
  list.innerHTML='';
  habits.forEach((h,i)=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<span class="name">${h.name.replace(/</g,'&lt;')}</span><span class="streak">🔥 ${streak(h)}</span><div class="days"></div><button class="del">✕</button>`;
    const days=r.querySelector('.days');
    last7.forEach(d=>{const k=iso(d),b=document.createElement('button');
      b.className='d'+(h.done.includes(k)?' on':'')+(k==iso(new Date())?' today':'');
      b.textContent='SMTWTFS'[d.getDay()];
      b.onclick=()=>{h.done=h.done.includes(k)?h.done.filter(x=>x!=k):[...h.done,k];save()};
      days.appendChild(b)});
    r.querySelector('.del').onclick=()=>{habits.splice(i,1);save()};
    list.appendChild(r)})}
f.onsubmit=e=>{e.preventDefault();habits.push({name:n.value.trim(),done:[]});n.value='';save()};
render();
</script></body></html>
